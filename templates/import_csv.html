{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
    <h2 class="text-2xl font-bold text-slate-800 mb-4">Import Invoice CSV</h2>

    <!-- CRITICAL: enctype must be multipart/form-data for file uploads -->
    <form method="POST" action="{{ url_for('admin_import_csv') }}" enctype="multipart/form-data">
        <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1">CSV File</label>
            <input type="file" name="file" accept=".csv" required
                   class="block w-full text-sm text-slate-600 border border-slate-300 rounded-lg p-2">
        </div>

        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-semibold">
            Upload & Import
        </button>
    </form>

    <div class="mt-6">
        <a href="{{ url_for('admin_dashboard') }}" class="text-blue-600 hover:underline text-sm">← Back to Schedule Generator</a>
    </div>
</div>
{% endblock %}
